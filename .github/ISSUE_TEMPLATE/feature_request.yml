name: 💡 功能建议
description: 希望增加或改进某个功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先说场景：你现在想做什么、卡在哪里
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你理想中这个功能怎么工作
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代方案
      description: 目前你是怎么绕过这个限制的（没有可以不填）
