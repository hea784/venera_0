name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to attach a GitHub Release (e.g. v1.0.0). Leave empty to only upload the artifact."
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"
      - name: Install release keystore
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$STORE_FILE" ] || [ -z "$PROPERTY_FILE" ]; then
            echo "::error::ANDROID_KEYSTORE / ANDROID_KEY_PROPERTIES secrets are not configured."
            exit 1
          fi
          echo "$STORE_FILE" | base64 --decode > android/keystore.p12
          echo "$PROPERTY_FILE" > android/key.properties
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: venera-apk
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: build/app/outputs/apk/release/*.apk
          generate_release_notes: true
